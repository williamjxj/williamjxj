<svg width="1400" height="440" viewBox="0 0 1400 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="82%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#3ECF8E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="16%" cy="86%" r="38%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="65%" stop-color="#DDE3EA"/>
      <stop offset="100%" stop-color="#9AA7B8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3ECF8E"/>
      <stop offset="100%" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#3ECF8E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="440" fill="url(#bg)"/>
  <rect width="1400" height="440" fill="url(#grid)"/>
  <rect width="1400" height="440" fill="url(#glowViolet)"/>
  <rect width="1400" height="440" fill="url(#glowTeal)"/>
  <rect width="1400" height="440" fill="url(#glowOrange)"/>

  <!-- floating particles -->
  <g opacity="0.4">
    <circle cx="190" cy="120" r="2.5" fill="#A78BFA">
      <animate attributeName="cy" values="120;104;120" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="330" r="2" fill="#5EEAD4">
      <animate attributeName="cy" values="330;316;330" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="150" r="2" fill="#D97757">
      <animate attributeName="cy" values="150;138;150" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="300" r="2.5" fill="#A78BFA">
      <animate attributeName="cy" values="300;286;300" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.8;0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="360" r="2" fill="#3ECF8E">
      <animate attributeName="cy" values="360;346;360" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1210" cy="120" r="2.5" fill="#5EEAD4">
      <animate attributeName="cy" values="120;106;120" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1330" cy="250" r="2" fill="#A78BFA">
      <animate attributeName="cy" values="250;236;250" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="80" r="2" fill="#D97757">
      <animate attributeName="cy" values="80;68;80" dur="9.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="9.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- status pill -->
  <rect x="80" y="62" width="330" height="32" rx="16" fill="#3ECF8E" opacity="0.08"/>
  <rect x="80" y="62" width="330" height="32" rx="16" fill="none" stroke="#3ECF8E" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="99" cy="78" r="4" fill="#3ECF8E">
    <animate attributeName="r" values="3.5;5;3.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="116" y="83" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="2.5" fill="#3ECF8E">OPEN TO AI &amp; WEB PROJECTS</text>

  <!-- name -->
  <text x="78" y="160" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#nameGrad)">William Jiang</text>
  <rect x="84" y="178" width="210" height="5" rx="2.5" fill="url(#lineGrad)"/>

  <!-- role -->
  <text x="80" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">
    <tspan fill="#E6EDF3">Senior Full-Stack Engineer</tspan>
    <tspan fill="#8B95A5">  ·  </tspan>
    <tspan fill="url(#roleGrad)" font-weight="700">AI Consultant</tspan>
  </text>

  <!-- tagline -->
  <text x="80" y="258" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17.5" fill="#8B95A5">I design and ship production-grade AI agents, SaaS products, and web platforms.</text>

  <!-- meta -->
  <text x="80" y="292" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" fill="#7D8590">📍 Surrey, BC 🇨🇦  ·  🌐 williamjxj.github.io  ·  💼 Best IT Consulting</text>

  <!-- terminal card -->
  <g filter="url(#softGlow)">
    <rect x="830" y="62" width="490" height="252" rx="14" fill="#0D1117" opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    <path d="M844,62 L1306,62 Q1320,62 1320,76 L1320,94 L830,94 L830,76 Q830,62 844,62 Z" fill="#FFFFFF" opacity="0.045"/>
    <circle cx="858" cy="78" r="5.5" fill="#FF5F57"/>
    <circle cx="880" cy="78" r="5.5" fill="#FEBC2E"/>
    <circle cx="902" cy="78" r="5.5" fill="#28C840"/>
    <text x="1075" y="83" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6E7681" text-anchor="middle">william.ts — ~/profile</text>
  </g>

  <!-- terminal code -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15.5">
    <text x="862" y="132" fill="#7D8590">
      <tspan fill="#C586C0">const</tspan> <tspan fill="#F0F6FC">william</tspan> <tspan fill="#7D8590">=</tspan> <tspan fill="#7D8590">{</tspan>
    </text>
    <text x="862" y="158" fill="#9CDCFE">  role:</text>
    <text x="922" y="158" fill="#3ECF8E">"Full-Stack Engineer"</text>
    <text x="1086" y="158" fill="#7D8590">,</text>
    <text x="862" y="184" fill="#9CDCFE">  focus:</text>
    <text x="922" y="184" fill="#3ECF8E">[</text>
    <text x="932" y="184" fill="#3ECF8E">"AI Agents"</text>
    <text x="1040" y="184" fill="#7D8590">,</text>
    <text x="1050" y="184" fill="#3ECF8E">"SaaS"</text>
    <text x="1110" y="184" fill="#7D8590">,</text>
    <text x="1120" y="184" fill="#3ECF8E">"Web"</text>
    <text x="1175" y="184" fill="#3ECF8E">]</text>
    <text x="1190" y="184" fill="#7D8590">,</text>
    <text x="862" y="210" fill="#9CDCFE">  company:</text>
    <text x="922" y="210" fill="#3ECF8E">"Best IT Consulting"</text>
    <text x="1092" y="210" fill="#7D8590">,</text>
    <text x="862" y="236" fill="#9CDCFE">  base:</text>
    <text x="922" y="236" fill="#3ECF8E">"Surrey, BC 🇨🇦"</text>
    <text x="1068" y="236" fill="#7D8590">,</text>
    <text x="862" y="262" fill="#9CDCFE">  hireable:</text>
    <text x="922" y="262" fill="#D97757">true</text>
    <text x="960" y="262" fill="#7D8590">,</text>
    <text x="862" y="288" fill="#7D8590">};</text>
    <rect x="886" y="272" width="9" height="17" rx="2" fill="#3ECF8E">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bottom waves -->
  <g opacity="0.9">
    <path fill="url(#waveB)">
      <animate attributeName="d" dur="11s" repeatCount="indefinite"
        values="M0,398 C180,372 360,416 560,394 C760,372 1040,412 1400,384 L1400,440 L0,440 Z;
                M0,390 C180,412 360,372 560,404 C760,392 1040,370 1400,398 L1400,440 L0,440 Z;
                M0,398 C180,372 360,416 560,394 C760,372 1040,412 1400,384 L1400,440 L0,440 Z"/>
    </path>
    <path fill="url(#waveA)">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0,412 C220,388 460,428 700,408 C940,388 1180,424 1400,402 L1400,440 L0,440 Z;
                M0,406 C220,426 460,386 700,420 C940,404 1180,382 1400,414 L1400,440 L0,440 Z;
                M0,412 C220,388 460,428 700,408 C940,388 1180,424 1400,402 L1400,440 L0,440 Z"/>
    </path>
  </g>
</svg>
